name: Release Android

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK components
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/25.2.9519653
            /usr/local/lib/android/sdk/build-tools/36.0.0
            /usr/local/lib/android/sdk/platforms/android-36
          key: android-sdk-ndk25.2.9519653-bt36.0.0-p36

      - name: Install Android NDK and build tools
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;25.2.9519653" "build-tools;36.0.0" "platforms;android-36"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download yt-dlp and FFmpeg for Android ABIs
        shell: bash
        run: |
          mkdir -p src-tauri/binaries

          # ---- yt-dlp ----
          # aarch64: portable static binary built via build-android-yt-dlp.yml
          curl -fL \
            "https://github.com/melkyfb/awesome-download-manager/releases/download/android-binaries/yt-dlp-aarch64-linux-android" \
            -o "src-tauri/binaries/yt-dlp-aarch64-linux-android"
          chmod +x "src-tauri/binaries/yt-dlp-aarch64-linux-android"

          # Linux host binary (needed by Tauri build tooling, not bundled in APK)
          curl -fL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" \
            -o "src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu"
          chmod +x "src-tauri/binaries/yt-dlp-x86_64-unknown-linux-gnu"

          # armv7/x86/x86_64: empty placeholders (not yet supported on these ABIs)
          for abi in armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            touch "src-tauri/binaries/yt-dlp-${abi}"
          done

          # ---- FFmpeg ----
          # All 4 Android ABIs from Khang-NT/ffmpeg-binary-android
          # These are Android Bionic-native binaries (use /system/bin/linker, depend only on libm/libz/libc)
          declare -A FFMPEG_ARCHIVES=(
            [aarch64-linux-android]="arm64-v8a-lite"
            [armv7-linux-androideabi]="armv7-a-lite"
            [x86_64-linux-android]="x86_64-lite"
            [i686-linux-android]="i686-lite"
          )
          FFMPEG_BASE="https://github.com/Khang-NT/ffmpeg-binary-android/releases/download/2018-07-31"
          for abi in "${!FFMPEG_ARCHIVES[@]}"; do
            archive="${FFMPEG_ARCHIVES[$abi]}"
            curl -fL "${FFMPEG_BASE}/${archive}.tar.bz2" -o "/tmp/ffmpeg-${abi}.tar.bz2"
            tar -xjf "/tmp/ffmpeg-${abi}.tar.bz2" -C /tmp
            mv /tmp/ffmpeg "src-tauri/binaries/ffmpeg-${abi}"
            chmod +x "src-tauri/binaries/ffmpeg-${abi}"
          done

          # FFmpeg placeholder for Linux host (not used at runtime, satisfies Tauri bundler)
          touch "src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu"

          echo "--- Binary inventory ---"
          ls -lh src-tauri/binaries/

      - name: Set version from git tag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.BUILD_VERSION.replace(/^v/, '');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + v + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            console.log('Version set to', v);
          "
        env:
          BUILD_VERSION: ${{ github.ref_name }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/awesome-dm.keystore"

      - name: Write keystore.properties
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=awesome-dm\nkeyPassword=%s\n' \
            "$HOME/awesome-dm.keystore" \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            > src-tauri/gen/android/keystore.properties

      - name: Build Android AAB
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: npm run tauri android build -- --aab

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: npm run tauri android build -- --apk

      - name: Upload AAB and APK to release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
