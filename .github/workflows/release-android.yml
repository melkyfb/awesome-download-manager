name: Release Android

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: |
          sdkmanager "ndk;25.2.9519653" "build-tools;36.0.0" "platforms;android-36"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/awesome-dm.keystore"

      - name: Write keystore.properties
        run: |
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=awesome-dm\nkeyPassword=%s\n' \
            "$HOME/awesome-dm.keystore" \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            > src-tauri/gen/android/keystore.properties

      - name: Build Android AAB
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: npm run tauri android build -- --aab

      - name: Upload AAB to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/gen/android/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
