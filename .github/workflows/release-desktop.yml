name: Release Desktop

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install npm dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set version from git tag
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Setting version to $VERSION"
          node -e "
            const fs = require('fs');
            const v = process.env.BUILD_VERSION.replace(/^v/, '');

            // Update tauri.conf.json
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = v;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
            console.log('tauri.conf.json version =>', v);

            // Update Cargo.toml (only the [package] version, first occurrence)
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \"[^\"]+\"/m, 'version = \"' + v + '\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            console.log('Cargo.toml version =>', v);
          "
        env:
          BUILD_VERSION: ${{ github.ref_name }}

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Awesome Download Manager ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          target: ${{ matrix.target }}

  generate-updater-json:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Generate and upload latest.json
        shell: bash
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="melkyfb/awesome-download-manager"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          echo "=== Release assets for ${TAG} ==="
          gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name'

          # Fetch release notes from the GitHub release body
          RELEASE_NOTES=$(gh release view "${TAG}" --repo "${REPO}" --json body --jq '.body')

          # Download all .sig files from the release (uploaded by tauri-action on each runner)
          mkdir -p sigs
          if ! gh release download "${TAG}" --repo "${REPO}" --pattern "*.sig" --dir ./sigs; then
            echo "::error::No .sig files found in release ${TAG}."
            echo "Make sure TAURI_SIGNING_PRIVATE_KEY is set in repository secrets."
            exit 1
          fi

          echo "=== Downloaded sig files ==="
          ls -la sigs/

          # Read signatures (strip trailing whitespace/newlines)
          LINUX_SIG=$(cat sigs/*.AppImage.tar.gz.sig 2>/dev/null | tr -d '\n\r' || true)
          WIN_SIG=$(cat sigs/*.msi.zip.sig 2>/dev/null | tr -d '\n\r' || true)
          MAC_SIG=$(cat sigs/*.app.tar.gz.sig 2>/dev/null | tr -d '\n\r' || true)

          # Derive asset filenames from .sig filenames, then URL-encode spaces
          url_encode() { python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$1"; }

          LINUX_ASSET=$(basename "$(ls sigs/*.AppImage.tar.gz.sig | head -1)" .sig)
          WIN_ASSET=$(basename "$(ls sigs/*.msi.zip.sig | head -1)" .sig)
          MAC_ASSET=$(basename "$(ls sigs/*.app.tar.gz.sig | head -1)" .sig)

          LINUX_URL="${BASE_URL}/$(url_encode "${LINUX_ASSET}")"
          WIN_URL="${BASE_URL}/$(url_encode "${WIN_ASSET}")"
          MAC_URL="${BASE_URL}/$(url_encode "${MAC_ASSET}")"

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "${RELEASE_NOTES}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg linux_sig "${LINUX_SIG}" \
            --arg linux_url "${LINUX_URL}" \
            --arg win_sig "${WIN_SIG}" \
            --arg win_url "${WIN_URL}" \
            --arg mac_sig "${MAC_SIG}" \
            --arg mac_url "${MAC_URL}" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64": { signature: $linux_sig, url: $linux_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64": { signature: $mac_sig, url: $mac_url }
              }
            }' > latest.json

          echo "Generated latest.json:"
          cat latest.json

          gh release upload "${TAG}" --repo "${REPO}" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
